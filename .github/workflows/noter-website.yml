name: Noter.ai Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/noter-website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/noter-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noter-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        run: npm ci
        working-directory: website
      - name: Build and check pages, links and preview server
        run: npm test
        working-directory: website
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
