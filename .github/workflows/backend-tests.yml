name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy -go=${{ env.GO_VERSION }}
          git diff --exit-code

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Test coverage regression and profile-merge checks
        run: node --test scripts/check-coverage.test.mjs

      - name: Test environment inventory and workstation-runner safeguards
        run: node --test scripts/check-env.test.mjs scripts/local-test.test.mjs

      - name: Verify documented application environment settings
        run: node scripts/check-env.mjs

      - name: Verify go fix
        run: go fix -diff ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=3m

  workstation-sqlite:
    name: Workstation SQLite (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: Windows
            runner: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exercise the documented workstation command with Docker unreachable
        # This deliberately tests the reduced workstation mode. The separate
        # store matrix still runs all three real database drivers without skips.
        env:
          CI: 'false'
          DOCKER_HOST: tcp://127.0.0.1:1
        run: node scripts/local-test.mjs

  workstation-gate:
    name: SQLite without Docker
    needs: workstation-sqlite
    if: always()
    runs-on: ubuntu-latest
    env:
      WORKSTATION_RESULT: ${{ needs.workstation-sqlite.result }}
    steps:
      - run: test "$WORKSTATION_RESULT" = success

  tests:
    name: Tests (${{ matrix.test-group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-group: [store, server, internal, other]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run tests
        run: |
          case "${{ matrix.test-group }}" in
            store)
              # Run store tests for all drivers (sqlite, mysql, postgres)
              # The all-driver TestMain wrapper starts child Go commands that do
              # not inherit coverage flags. Run each real driver explicitly.
              for driver in sqlite mysql postgres; do
                DRIVER="$driver" go test -v -count=1 -coverpkg=./store/... -coverprofile="coverage-$driver.out" -covermode=atomic ./store/...
              done
              node scripts/check-coverage.mjs merge coverage.out coverage-sqlite.out coverage-mysql.out coverage-postgres.out
              ;;
            server)
              # Includes ./server/test, which boots the real server via
              # server.NewServer and smokes every router it mounts.
              go test -v -race -coverpkg=./server/... -coverprofile=coverage.out -covermode=atomic ./server/...
              ;;
            internal)
              go test -v -race -coverpkg=./internal/... -coverprofile=coverage.out -covermode=atomic ./internal/...
              ;;
            other)
              go test -v -race -coverpkg=./cmd/...,./core/...,./markdown/...,./filter/...,./provider/...,./proto/... -coverprofile=coverage.out -covermode=atomic \
                ./cmd/... ./core/... ./markdown/... ./filter/... ./provider/... ./proto/...
              ;;
          esac
        env:
          DRIVER: sqlite

      - name: Enforce measured backend coverage floor
        run: node scripts/check-coverage.mjs "${{ matrix.test-group }}" coverage.out

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: ${{ matrix.test-group }}
          fail_ci_if_error: false

      - name: Preserve backend coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.test-group }}
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14
