name: Bug Report
description: Report something that is not working as expected
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Before submitting, please search [existing issues](https://github.com/mrfost07/noter.ai/issues) and, if possible, check [releases](https://github.com/mrfost07/noter.ai/releases). For questions and setup help, use [Discussions](https://github.com/mrfost07/noter.ai/discussions).

  - type: checkboxes
    id: pre-check
    attributes:
      label: Check before submitting
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Tell us what happened and what you expected instead.
      placeholder: |
        What happened:
        What I expected:
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Give us the shortest steps that reproduce the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Noter.ai version
      description: Include the release version or the source commit used to build the app.
      placeholder: "26.10.15-rc.1 or main@abcdef"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add relevant deployment details, logs, screenshots, or recordings. Remove secrets before submitting.
      placeholder: |
        Deployment / database / browser:
        Logs or screenshots:
